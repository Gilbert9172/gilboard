################################## NETWORK #####################################

# Redis가 바인딩될 IP 주소 (모든 네트워크 인터페이스에 바인딩하려면 0.0.0.0 사용)
bind 0.0.0.0

# Redis를 사용할 포트 설정 (기본: 6379)
port 6379

# 보호 모드 설정 (기본: yes)
# 보호 모드가 활성화되면 외부에서 접근을 제한합니다.
protected-mode no

################################## GENERAL #####################################

# 데몬 모드 설정 (yes로 설정하면 백그라운드에서 실행됨)
daemonize no

# 프로세스 PID 파일 경로
# pidfile /var/run/redis/redis-server.pid

# 로그 파일 경로 (stdout 출력은 로그 파일 대신 콘솔에 출력)
# logfile ""

# 로그 레벨 설정 (debug | verbose | notice | warning)
# loglevel notice

################################# MEMORY #######################################

# 최대 메모리 사용량 (예: 256MB)
# maxmemory 256mb

# 메모리가 가득 찼을 때 데이터 제거 정책
# volatile-lru: TTL이 있는 키 중 LRU 제거
# allkeys-lru: 모든 키 중 LRU 제거
# noeviction: 아무것도 제거하지 않고 에러 반환
# maxmemory-policy allkeys-lru

################################# PERSISTENCE ##################################

# 데이터 지속성 설정 (RDB 스냅샷 저장)
# 900초 동안 최소 1개의 변경이 있을 경우 스냅샷 저장
# save 900 1

# 300초 동안 최소 10개의 변경이 있을 경우 스냅샷 저장
# save 300 10

# 60초 동안 최소 10000개의 변경이 있을 경우 스냅샷 저장
# save 60 10000

# RDB 파일 경로
# dbfilename dump.rdb
dir ./

# AOF (Append Only File) 설정: 데이터를 지속적으로 저장
# appendonly yes
# appendfilename "appendonly.aof"

# AOF 동기화 방식 설정
# always: 모든 쓰기 명령어를 동기화
# everysec: 1초마다 동기화 (기본값)
# no: OS가 알아서 동기화
# appendfsync everysec

################################# SECURITY #####################################

# 비밀번호 설정 (비밀번호 인증이 필요한 경우)
# requirepass yourpassword

################################# REPLICATION ##################################

# Redis Replication 설정 (Slave 노드 설정)
# master의 IP와 포트를 지정하면 이 Redis는 Slave로 동작합니다.
# replicaof <masterip> <masterport>
# replicaof 127.0.0.1 6379

################################### CLIENT #####################################

# 최대 클라이언트 연결 수 설정 (기본: 10000)
maxclients 10000

################################## TIMEOUT #####################################

# 클라이언트의 연결 유지 시간 (초 단위, 0은 무제한)
timeout 300

#################### KERNEL transparent hugepage CONTROL ######################
disable-thp yes

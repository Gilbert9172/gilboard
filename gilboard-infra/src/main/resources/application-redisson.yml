singleServerConfig:
  address: "redis://127.0.0.1:6380" # Redis 서버 주소 (redis:// 또는 rediss://)
  password: null                    # Redis 비밀번호 (있는 경우 비밀번호 입력)
  connectionPoolSize: 10            # 연결 풀 크기
  connectionMinimumIdleSize: 2      # 최소 연결 유지 크기
  idleConnectionTimeout: 10000      # idle 상태의 연결을 닫기까지의 시간(ms)
  connectTimeout: 10000             # 서버 연결 타임아웃(ms)
  timeout: 3000                     # 명령 실행 타임아웃(ms)
  retryAttempts: 3                  # 명령 실패 시 재시도 횟수
  retryInterval: 1500               # 재시도 간격(ms)
